[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfengine-code"
version = "0.1.0"
description = "Edit named code roles and render source files with TextFoundryEngine"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Artem Durynin"}]
dependencies = []

[project.scripts]
tfe-code = "tfengine_code.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
