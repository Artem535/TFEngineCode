name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  native-and-python:
    name: Native & Python CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TFEngineCode
        uses: actions/checkout@v4

      - name: Checkout TextFoundryEngine
        uses: actions/checkout@v4
        with:
          repository: Artem535/TextFoundryEngine
          ref: feat/structural-fragments
          path: TextFoundryEngine

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libomp-dev pkg-config autoconf autoconf-archive automake libtool zip unzip curl tar

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          # Bump the vcpkg-bincache-vN prefix to invalidate stale package archives,
          # e.g. after a runner image or compiler change.
          key: vcpkg-bincache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install vcpkg Dependencies
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ runner.temp }}/vcpkg-bincache,readwrite"
        run: |
          $VCPKG_INSTALLATION_ROOT/vcpkg install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DTEXTFOUNDRY_SOURCE_DIR="$GITHUB_WORKSPACE/TextFoundryEngine"

      - name: Build Native Targets
        run: cmake --build build --parallel

      - name: Run Native CTests
        run: ctest --test-dir build --output-on-failure

      - name: Install Python Package
        run: python -m pip install -e . pytest

      - name: Run Python Pytest Suite with Native Binary
        run: TFE_CODE_NATIVE="$GITHUB_WORKSPACE/build/tfe-code" TFE_CODE_RENDERER="$GITHUB_WORKSPACE/build/tfe-code-render" pytest -v tests/
