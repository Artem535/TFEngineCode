name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.2.2)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            shared_ext: so
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            shared_ext: so
          - target: aarch64-apple-darwin
            os: macos-14
            shared_ext: dylib

    steps:
      - name: Checkout TFEngineCode
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout TextFoundryEngine
        uses: actions/checkout@v4
        with:
          repository: Artem535/TextFoundryEngine
          ref: feat/structural-fragments
          path: TextFoundryEngine

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libomp-dev pkg-config zip unzip curl tar

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config

      - name: Setup vcpkg
        shell: bash
        run: |
          if [ -z "$VCPKG_INSTALLATION_ROOT" ] || [ ! -x "$VCPKG_INSTALLATION_ROOT/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
            "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
            echo "VCPKG_INSTALLATION_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"
          fi

      - name: Install vcpkg Dependencies
        shell: bash
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DTEXTFOUNDRY_SOURCE_DIR="$GITHUB_WORKSPACE/TextFoundryEngine" \
            -DTFE_CODE_STATIC_LIBSTDCXX=ON

      - name: Build tfe-code & tests
        run: cmake --build build --parallel

      - name: Run CTests
        run: ctest --test-dir build --output-on-failure

      - name: Package Release
        shell: bash
        run: |
          mkdir -p dist
          cp build/tfe-code dist/
          cp build/_deps/objectbox-download-src/lib/libobjectbox.${{ matrix.shared_ext }}* dist/
          chmod +x dist/tfe-code

          # Verify binary execution in isolated directory
          (cd dist && ./tfe-code help >/dev/null)

          ARCHIVE="tfe-code-${{ matrix.target }}.tar.gz"
          tar -czvf "$ARCHIVE" -C dist .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag_name != ''
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            tfe-code-${{ matrix.target }}.tar.gz
            tfe-code-${{ matrix.target }}.tar.gz.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
